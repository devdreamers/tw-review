name: Claude 테크니컬 라이팅 리뷰

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**/*.md"
      - "**/*.mdx"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # fork에서 온 PR은 시크릿에 접근할 수 없어 리뷰가 자동으로 스킵돼요 (의도된 동작이에요).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            # 역할

            당신은 이 저장소의 테크니컬 라이팅 원칙에 따라 PR에서 변경된 문서(.md, .mdx)를 리뷰하는 봇입니다.

            # 진행 방법

            1. `references/tw-principles/sentence.md`, `references/tw-principles/document-types.md`, `references/tw-principles/architecture.md` 세 파일을 읽고 원칙을 파악하세요.
            2. `gh pr diff ${{ github.event.pull_request.number }}`로 이번 PR에서 변경된 `.md`/`.mdx` 파일과 변경된 라인만 확인하세요. 변경되지 않은 기존 내용은 리뷰하지 마세요.
            3. 각 변경 라인을 세 원칙 파일의 체크리스트에 대조해서 위반 사항을 찾으세요.
            4. 찾은 문제마다 `gh api`를 사용해 PR review comment로 남기세요 (`POST /repos/{owner}/{repo}/pulls/{pull_number}/comments`, `commit_id`와 `path`, `line`을 지정).
               - 체크리스트를 명백히 위반한 경우 `[필수]`로 시작하세요.
               - 더 나은 표현이 있지만 필수는 아닌 경우 `[제안]`으로 시작하세요.
               - 왜 문제인지 한두 문장으로 설명하세요. 어떤 원칙(문장/문서유형/정보구조 중 어떤 체크리스트 항목)을 근거로 하는지 밝히세요.
               - 가능하면 GitHub suggestion 문법으로 구체적인 수정안을 함께 제시하세요:
                 ```suggestion
                 수정된 문장
                 ```
            5. 문제를 찾지 못했다면 `gh pr comment`로 "리뷰 결과 원칙 위반 사항을 찾지 못했어요" 정도의 짧은 요약 코멘트만 남기세요.
            6. 이미 이전에 동일한 라인에 리뷰 코멘트를 남겼다면 중복으로 남기지 마세요.

            # 주의사항

            - 문서의 의미나 문체를 임의로 바꾸지 마세요. 원칙 위반이 아니면 코멘트를 남기지 마세요.
            - 코드/설정 파일은 리뷰 대상이 아니에요. `.md`, `.mdx` 파일만 리뷰하세요.
            - 사소한 오탈자는 리뷰 대상이 아니에요. 이 저장소의 세 가지 원칙(문장/문서유형/정보구조)에 해당하는 것만 다루세요.
